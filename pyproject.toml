[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sink"
version = "0.3.0"
description = "Sink is a command line tool for developers to help building websites."
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-2.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sheldon McGrandle", email = "developer@8cylinder.com" }]
keywords = ["cli", "rsync", "ssh", "mysql"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click>=8.5",
  "PyYAML>=6.0.4",
  "rich>=15",
]

[project.scripts]
sink = "sink.cli:main"

[project.urls]
Homepage = "https://github.com/8cylinder/sink"
Repository = "https://github.com/8cylinder/sink"
Issues = "https://github.com/8cylinder/sink/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff",
  "ty",
  "import-linter",
  "sphinx>=8",
  "myst-parser>=4",
  "furo>=2024",
  "sphinx-click>=6",
  "sphinx-autobuild>=2024",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sink"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sink",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CONTRIBUTORS.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CHANGELOG.md",
  "docs",
  "pyproject.toml",
  "Makefile",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "docs/_build",
]

[tool.ruff]
line-length = 80
target-version = "py315"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "S",
  "RUF",
  "PGH003",
  "PYI",
  "ANN",
  "PTH",
  "DTZ",
  "RET",
  "ARG",
]
ignore = [
  "E501",    # long legacy strings and comments; formatter handles code
  "RUF001",  # ambiguous unicode in user-facing labels
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",  # asserts are the test mechanism
  "S603",  # subprocess calls exercise the hook
  "S607",  # partial paths in test subprocesses
  "ANN",   # pytest fixtures and test parameters are dynamic
]
"src/sink/**" = [
  "S603",  # subprocess call: confined to shell.py
  "S607",  # partial executable path: rsync/ssh/scp/mysql names
  "S310",  # urllib URL open in check
  "S311",  # non-crypto random for the spinner
]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration' --cov=sink --cov-branch --cov-report=term-missing"
markers = [
  "integration: needs real rsync, ssh, mysql, or network",
]

[tool.coverage.run]
branch = true
source = ["sink"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "sink"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Runtime sits above the loader"
type = "layers"
layers = [
  "sink.cli",
  "sink.runtime",
  "sink.config.loader",
  "sink.config.models",
]

[[tool.importlinter.contracts]]
name = "Only Runtime loads configuration"
type = "forbidden"
source_modules = [
  "sink.actions",
  "sink.applications",
  "sink.check",
  "sink.credentials",
  "sink.db",
  "sink.init",
  "sink.rsync",
  "sink.shell",
  "sink.ssh",
  "sink.ui",
]
forbidden_modules = ["sink.config.loader"]

[[tool.importlinter.contracts]]
name = "Models do not depend on the loader or runtime"
type = "forbidden"
source_modules = ["sink.config.models"]
forbidden_modules = ["sink.config.loader", "sink.runtime"]
