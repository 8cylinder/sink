[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sink"
version = "0.3.0"
description = "Sink is a command line tool for developers to help building websites."
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-2.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sheldon McGrandle", email = "developer@8cylinder.com" }]
keywords = ["cli", "deployment", "rsync", "ssh", "mysql"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click>=8.5",
  "PyYAML>=6.0.4",
  "coolname>=2.0",
  "plumbum>=2.0",
  "rich>=15",
]

[project.scripts]
sink = "sink.sink:sink"

[project.urls]
Homepage = "https://github.com/8cylinder/sink"
Repository = "https://github.com/8cylinder/sink"
Issues = "https://github.com/8cylinder/sink/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff",
  "ty",
  "import-linter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sink"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sink",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CONTRIBUTORS.md",
  "pyproject.toml",
  "Makefile",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]
