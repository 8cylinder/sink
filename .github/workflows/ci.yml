name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: make check
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          archive=/tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make secrets

  integration:
    name: integration (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Show Docker versions
        run: |
          docker compose version
          docker info --format '{{.ServerVersion}}'
      - name: Restore server image
        id: image-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/sink-test-server-${{ matrix.ubuntu }}.tar
          key: sink-test-server-${{ matrix.ubuntu }}-${{ hashFiles('tests/integration/server/**') }}
      - name: Load server image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/sink-test-server-${{ matrix.ubuntu }}.tar
      - name: Run integration tests
        env:
          SINK_TEST_UBUNTU: ${{ matrix.ubuntu }}
          SINK_TEST_KEEP: "1"
          SINK_TEST_SKIP_BUILD: ${{ steps.image-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: make integration
      - name: Save server image
        if: always() && steps.image-cache.outputs.cache-hit != 'true'
        run: docker save sink-test-server:${{ matrix.ubuntu }} -o /tmp/sink-test-server-${{ matrix.ubuntu }}.tar || true
      - name: Container logs on failure
        if: failure()
        run: |
          for id in $(docker ps -aq --filter label=sink.integration=true); do
            echo "=== $id ==="
            docker logs "$id" 2>&1 | tail -n 200 || true
          done
      - name: Remove integration containers
        if: always()
        run: make integration-down
